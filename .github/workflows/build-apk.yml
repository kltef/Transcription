name: Build APK

# Builds the arm64-v8a debug APK on GitHub's runners and publishes it as a
# Release asset, so it can be downloaded directly (e.g. on a phone for sideloading).
on:
  push:
    branches:
      - "claude/on-device-speech-transcription-xb1cef"
    paths-ignore:
      - "**.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK + CMake
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0" \
                     "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Fetch native dependencies (sherpa AAR, streaming model, whisper.cpp source)
        run: bash scripts/fetch-native.sh

      - name: Build slim (arm64-v8a) debug APK
        run: ./gradlew assembleDebug -PslimAbi --no-daemon --stacktrace

      - name: Stage APK
        run: cp app/build/outputs/apk/debug/app-debug.apk VoiceKeyboard-arm64-debug.apk

      - name: Publish as a Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.0-debug
          name: Voice Keyboard v0.2.0 (debug)
          body: |
            On-device voice dictation keyboard — arm64-v8a, debug-signed (sideload-ready).

            **New in 0.2.0:** automatic capitalization + punctuation (works even without the
            Whisper model), snappier phrase finalization, long-press backspace to delete a word,
            and a listening pulse on the mic.

            **Install:** download `VoiceKeyboard-arm64-debug.apk` below on your phone and
            open it (allow "install unknown apps"). Then open the app, enable the keyboard,
            and grant the microphone. The Whisper model download is optional (extra accuracy).
          files: VoiceKeyboard-arm64-debug.apk
